    - "[permission]#permission# torosamyreward.time.little.pass"
    - "[message] 测试权限成功"
    - "[start_with] teststr test"
    - "[message] test == str"
    - "[start_with]#start_with# test teststr"
    - "[message] 这句不该执行"
